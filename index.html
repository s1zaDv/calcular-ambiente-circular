<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircleCalc | Calculadora Circular</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f7f1e9;
        color: #40352e;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 450px;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 40px;
        color: #c46b43;
      }

      header p {
        color: #88796e;
        margin-top: 10px;
      }

      .calculator {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px #0000000d;
      }

      h2 {
        margin-bottom: 20px;
      }

      .circle {
        width: 100px;
        height: 100px;
        border: 5px solid #c46b43;
        border-radius: 50%;
        margin: 20px auto 30px;
      }

      label {
        display: block;
        margin-bottom: 10px;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd0c5;
        border-radius: 7px;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #c46b43;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #a95632;
      }

      #resultado {
        margin-top: 25px;
        color: #c46b43;
        font-size: 18px;
        font-weight: bold;
        line-height: 2;
      }

      footer {
        text-align: center;
        margin-top: 25px;
        color: #88796e;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>CircleCalc</h1>
        <p>Descubra as dimensões de um círculo.</p>
      </header>

      <section class="calculator">
        <h2>Calculadora circular</h2>

        <div class="circle"></div>

        <label>Raio do círculo (metros)</label>
        <input type="number" id="raio" placeholder="Ex: 5" />

        <button onclick="mostrarCalculo()">Calcular</button>

        <div id="resultado"></div>
      </section>

      <footer>
        <p>CircleCalc © 2026</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
